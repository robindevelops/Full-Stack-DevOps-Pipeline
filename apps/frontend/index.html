<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple SaaS DevOps</title>
    <style>
        :root {
            --primary: #4F46E5;
            --background: #F3F4F6;
            --surface: #FFFFFF;
            --text: #1F2937;
        }
        body {
            font-family: 'Inter', system-ui, sans-serif;
            background-color: var(--background);
            color: var(--text);
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            background-color: var(--surface);
            padding: 2rem;
            border-radius: 1rem;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            width: 100%;
            max-width: 500px;
        }
        h1 {
            margin-top: 0;
            font-size: 1.5rem;
            color: var(--primary);
        }
        ul {
            list-style-type: none;
            padding: 0;
        }
        li {
            background: var(--background);
            margin-bottom: 0.5rem;
            padding: 1rem;
            border-radius: 0.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .status {
            font-size: 0.875rem;
            background: #E0E7FF;
            color: var(--primary);
            padding: 0.25rem 0.5rem;
            border-radius: 9999px;
        }
        .add-task {
            display: flex;
            margin-top: 1.5rem;
        }
        input {
            flex-grow: 1;
            padding: 0.75rem;
            border: 1px solid #D1D5DB;
            border-radius: 0.5rem 0 0 0.5rem;
            outline: none;
        }
        button {
            padding: 0.75rem 1.5rem;
            background-color: var(--primary);
            color: white;
            border: none;
            border-radius: 0 0.5rem 0.5rem 0;
            cursor: pointer;
            font-weight: 600;
        }
        button:hover {
            background-color: #4338CA;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Task Flow (SaaS)</h1>
    <ul id="task-list">
        <li>Loading tasks...</li>
    </ul>

    <div class="add-task">
        <input type="text" id="task-input" placeholder="New DevOps task...">
        <button onclick="addTask()">Add Task</button>
    </div>
</div>

<script>
    async function fetchTasks() {
        try {
            const res = await fetch('http://localhost:3000/api/tasks');
            const tasks = await res.json();
            const list = document.getElementById('task-list');
            list.innerHTML = '';
            tasks.forEach(task => {
                const li = document.createElement('li');
                li.innerHTML = `<span>${task.title}</span> <span class="status">${task.status}</span>`;
                list.appendChild(li);
            });
        } catch (error) {
            console.error('Error fetching tasks:', error);
            document.getElementById('task-list').innerHTML = '<li>Error loading tasks.</li>';
        }
    }

    async function addTask() {
        const input = document.getElementById('task-input');
        const title = input.value.trim();
        if (!title) return;

        try {
            await fetch('http://localhost:3000/api/tasks', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ title })
            });
            input.value = '';
            fetchTasks();
        } catch (error) {
            console.error('Error adding task:', error);
        }
    }

    // Initial load
    fetchTasks();
</script>

</body>
</html>

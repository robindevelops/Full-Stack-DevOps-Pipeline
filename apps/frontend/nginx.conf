# =========================================================================
# HOW TO WRITE NGINX FILES: THE CONTEXT HIERARCHY
# =========================================================================
# Nginx files are organized into "Contexts" (blocks) that look like a tree:
#
# 1. MAIN CONTEXT (The root)
#    └── 2. EVENTS CONTEXT (worker connections)
#    └── 3. HTTP CONTEXT (web traffic settings)
#         └── 4. SERVER CONTEXT (virtual hosts / websites)
#              └── 5. LOCATION CONTEXT (specific URL routes)
#
# IMPORTANT WARNING FOR DOCKER:
# The global "Boss" file at `/etc/nginx/nginx.conf` ALREADY contains the
# MAIN, EVENTS, and HTTP contexts.
# Because this file is loaded *inside* the Boss's HTTP context, you CANNOT
# define `events` or `http` here again. It will cause Nginx to crash!
#
# Therefore, in Docker `conf.d/` files, you ALWAYS start directly with `server`.
# =========================================================================


server {
    # 'listen' defines the port this server block responds to.
    listen 80;

    # 'server_name' defines which domain this applies to (e.g., mydomain.com).
    # 'localhost' or '_' is often used as a catch-all in Docker.
    server_name localhost;


    # ---------------------------------------------------------------------
    # LOCATION CONTEXT: /
    # Handles all general traffic (e.g. going to http://localhost/)
    # ---------------------------------------------------------------------
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # ---------------------------------------------------------------------
    # LOCATION CONTEXT: /api/
    # Handles traffic specific to your backend (e.g. http://localhost/api/users)
    # ---------------------------------------------------------------------
    location /api/ {
        proxy_pass http://localhost:3000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
